name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The application workspaces share one short job and one install. Firmware runs in separate target
# jobs because its board toolchains and simulator dependencies are larger, cached separately, and
# useful to diagnose independently from application lint and tests.
jobs:
  ci:
    name: lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The script tests generate Cardputer configuration from the pinned flint input.
          submodules: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # .node-version is the single source of truth — mise reads it locally too.
          node-version-file: '.node-version'
          cache: npm

      - name: Install
        run: |
          npm ci
          npm ci --prefix service
          npm ci --prefix executor
          npm ci --prefix devices

      - name: Versions are consistent
        run: node scripts/check-versions.ts

      - name: Contrast meets WCAG AA
        run: node scripts/check-contrast.ts

      - name: Lint and format
        run: npm run lint

      # `scripts/` is not a workspace and has no package.json, so nothing else here would run its
      # tests. It got them because a scoped capture used to delete the shots it was not asked to
      # retake, which cost a real review twenty-four panels — a bug with no runner is a bug that
      # comes back.
      - name: Scripts — test
        run: node --test scripts/

      - name: Service — typecheck and test
        run: |
          npx --prefix service tsc --noEmit --project service
          npm test --prefix service

      - name: Executor — typecheck and test
        run: |
          npx --prefix executor tsc --noEmit --project executor
          npm test --prefix executor

      # System dependencies, not npm ones: devices paint key faces by rasterising SVG.
      #
      # Three packages, and the third is the one that bites. ImageMagick 6 does not rasterise SVG
      # itself — it shells out to `rsvg-convert` — and on Ubuntu that delegate lives in
      # libmagickcore-6.q16-6-extra, a *recommend* of imagemagick rather than a depend.
      #
      # The step then proves it works, and fails if it does not. Without that the suites skip
      # themselves and `node --test` reports a whole skipped describe as no tests at all: the run
      # goes green having quietly not run thirty of them, which is the failure this workspace was
      # added to CI to stop.
      - name: Devices — install a rasteriser, and prove it rasterises
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick librsvg2-bin libmagickcore-6.q16-6-extra
          svg='<svg xmlns="http://www.w3.org/2000/svg" width="1" height="1"><rect width="1" height="1" fill="#ff0000"/></svg>'
          for bin in magick convert; do
            command -v "$bin" >/dev/null || continue
            bytes=$(printf '%s' "$svg" | "$bin" -background none svg:- -alpha remove -alpha off -depth 8 RGB:- | wc -c)
            echo "$bin rendered $bytes bytes (want 3)"
            [ "$bytes" = "3" ] && exit 0
          done
          echo "::error::no working SVG rasteriser after install — the devices paint tests would skip silently"
          exit 1

      - name: Devices — typecheck and test
        run: |
          c++ --version
          npx --prefix devices tsc --noEmit --project devices
          npm test --prefix devices

      # No install step: the widget has no dependencies at all. Its logic lives in a plain script
      # that QML's engine loads, and the tests drive it through `require` under node --test.
      - name: Widget — test
        run: npm test --prefix widget

      - name: Site builds
        run: node site/build.ts

  # Firmware has a separate toolchain and a much larger cache than the TypeScript workspaces. Keep
  # it isolated so a board compiler download cannot hide or delay a lint failure. Each target always
  # reports a result, while its expensive steps run only when one of its inputs changed. The matrix
  # lets the two boards compile in parallel when a shared input selects both.
  firmware:
    name: firmware (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [cardputer, esp32]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Exact event SHAs keep overlapping push runs independent. Full history makes both the PR
          # base and push predecessor available; an absent new-branch base fails safe to a build.
          fetch-depth: 0

      - name: Select firmware work for this change
        id: firmware-changes
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          decision=true
          if classified=$(node scripts/firmware-changes.mjs "$BASE_SHA" "$HEAD_SHA" "${{ matrix.target }}"); then
            case "$classified" in
              true|false) decision=$classified ;;
              *) echo "::warning::firmware path classifier returned an invalid result; building" ;;
            esac
          else
            echo "::warning::firmware path classifier failed; building"
          fi
          echo "run=$decision" >> "$GITHUB_OUTPUT"

      - name: No firmware inputs changed
        if: steps.firmware-changes.outputs.run != 'true'
        run: echo "${{ matrix.target }} firmware skipped because only independent paths changed."

      - name: Check out firmware submodules
        if: steps.firmware-changes.outputs.run == 'true' && matrix.target == 'cardputer'
        run: git submodule update --init --recursive

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.firmware-changes.outputs.run == 'true'
        with:
          node-version-file: '.node-version'

      - name: Bootstrap repository
        if: steps.firmware-changes.outputs.run == 'true'
        run: npm ci

      - name: Install Cardputer simulator system dependencies
        if: steps.firmware-changes.outputs.run == 'true' && matrix.target == 'cardputer'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential libsdl2-dev python3-venv
          command -v c++

      - name: Install ESP32 simulator system dependencies
        if: steps.firmware-changes.outputs.run == 'true' && matrix.target == 'esp32'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential imagemagick
          command -v c++

      # Each target restores only the toolchain it uses. Separate keys and path sets keep a partial
      # cache from one board from becoming the starting state for the other.
      - name: Restore Cardputer toolchain
        if: steps.firmware-changes.outputs.run == 'true' && matrix.target == 'cardputer'
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .cache/device/platformio
          key: ${{ runner.os }}-anchor-firmware-cardputer-${{ hashFiles('devices/toolchain.json') }}
          restore-keys: |
            ${{ runner.os }}-anchor-firmware-cardputer-

      - name: Restore ESP32 toolchain
        if: steps.firmware-changes.outputs.run == 'true' && matrix.target == 'esp32'
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            .cache/device/arduino
            .cache/device/bin/arduino-cli
            .cache/device/vendor
          key: ${{ runner.os }}-anchor-firmware-esp32-${{ hashFiles('devices/toolchain.json') }}
          restore-keys: |
            ${{ runner.os }}-anchor-firmware-esp32-

      - name: Install pinned PlatformIO CLI
        if: steps.firmware-changes.outputs.run == 'true' && matrix.target == 'cardputer'
        run: |
          export PLATFORMIO_CORE_DIR="$GITHUB_WORKSPACE/.cache/device/platformio"
          export PLATFORMIO_BUILD_DIR="$GITHUB_WORKSPACE/.cache/device/build/platformio"
          export PLATFORMIO_LIBDEPS_DIR="$GITHUB_WORKSPACE/.cache/device/platformio/libdeps"
          export PLATFORMIO_SETTING_ENABLE_TELEMETRY=no
          platformio_version=$(jq -r '.tools.platformioCore' devices/toolchain.json)
          mkdir -p .cache/device/platformio

          pio=.cache/device/platformio/venv/bin/pio
          if ! "$pio" --version 2>/dev/null | grep -Fq "$platformio_version"; then
            python3 -m venv --clear .cache/device/platformio/venv
            .cache/device/platformio/venv/bin/pip install --disable-pip-version-check \
              "platformio==$platformio_version"
          fi

          echo "$GITHUB_WORKSPACE/.cache/device/platformio/venv/bin" >> "$GITHUB_PATH"
          "$pio" --version

      - name: Install pinned Arduino CLI
        if: steps.firmware-changes.outputs.run == 'true' && matrix.target == 'esp32'
        run: |
          arduino_version=$(jq -r '.tools.arduinoCli.version' devices/toolchain.json)
          arduino_sha=$(jq -r '.tools.arduinoCli.linuxX64Sha256' devices/toolchain.json)
          mkdir -p .cache/device/bin

          arduino=.cache/device/bin/arduino-cli
          if ! "$arduino" version 2>/dev/null | grep -Fq "$arduino_version"; then
            archive="$RUNNER_TEMP/arduino-cli.tar.gz"
            curl --fail --location --silent --show-error \
              "https://github.com/arduino/arduino-cli/releases/download/v$arduino_version/arduino-cli_${arduino_version}_Linux_64bit.tar.gz" \
              --output "$archive"
            echo "$arduino_sha  $archive" | sha256sum --check --strict
            tar -xzf "$archive" -C .cache/device/bin arduino-cli
          fi

          echo "$GITHUB_WORKSPACE/.cache/device/bin" >> "$GITHUB_PATH"
          "$arduino" version

      - name: Bootstrap pinned firmware toolchains
        if: steps.firmware-changes.outputs.run == 'true'
        run: node scripts/device.ts bootstrap ${{ matrix.target }}

      - name: Verify firmware toolchains
        if: steps.firmware-changes.outputs.run == 'true'
        run: node scripts/device.ts doctor ${{ matrix.target }}

      # CI also performs an isolated second compile with nonsecret placeholders. The device command
      # requires compile evidence plus the placeholder in the linked image, then deletes that image
      # so it cannot be mistaken for firmware to flash.
      - name: Build physical firmware targets and active network paths
        if: steps.firmware-changes.outputs.run == 'true'
        env:
          CI: 'true'
        run: node scripts/device.ts build ${{ matrix.target }}

      - name: Run firmware simulator smoke tests
        if: steps.firmware-changes.outputs.run == 'true'
        run: node scripts/device.ts sim ${{ matrix.target }}
