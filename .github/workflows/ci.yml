name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One job, named steps. Five separate jobs each paid ~12s of runner boot and checkout for ~10s of
# actual work, and the setup was duplicated five ways. Steps still attribute failures clearly in the
# UI, and the whole thing finishes faster than the old jobs took to start.
jobs:
  ci:
    name: lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # .node-version is the single source of truth — mise reads it locally too.
          node-version-file: '.node-version'
          cache: npm

      - name: Install
        run: |
          npm ci
          npm ci --prefix service
          npm ci --prefix executor
          npm ci --prefix devices

      - name: Versions are consistent
        run: node scripts/check-versions.ts

      - name: Contrast meets WCAG AA
        run: node scripts/check-contrast.ts

      - name: Lint and format
        run: npm run lint

      - name: Service — typecheck and test
        run: |
          npx --prefix service tsc --noEmit --project service
          npm test --prefix service

      - name: Executor — typecheck and test
        run: |
          npx --prefix executor tsc --noEmit --project executor
          npm test --prefix executor

      # A system dependency, not an npm one: devices paint key faces by rasterising SVG, so the
      # tests that check a frame is the right size need a real rasteriser. The runner ships
      # neither `magick` (ImageMagick 7) nor `convert` (6), which is what turned these tests red
      # the first time CI ran them at all.
      - name: Devices — install ImageMagick
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends imagemagick

      - name: Devices — typecheck and test
        run: |
          npx --prefix devices tsc --noEmit --project devices
          npm test --prefix devices

      # No install step: the widget has no dependencies at all. Its logic lives in a plain script
      # that QML's engine loads, and the tests drive it through `require` under node --test.
      - name: Widget — test
        run: npm test --prefix widget

      - name: Site builds
        run: node site/build.ts
