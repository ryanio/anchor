name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  versions:
    name: node version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
      - run: node scripts/check-versions.ts

  lint:
    name: biome — lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx biome ci .

  service:
    name: service — typecheck & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # .node-version is the single source of truth — mise reads it locally too.
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: service/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  executor:
    name: executor — typecheck & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: executor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Native TypeScript execution, same reason as the service: no build step.
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: executor/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  site:
    name: site — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
      - run: node site/build.ts
