name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  service:
    name: service — typecheck & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Native TypeScript execution and node:sqlite. Both are why this
          # project has no build step and no native dependencies.
          node-version: '24'
          cache: npm
          cache-dependency-path: service/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
