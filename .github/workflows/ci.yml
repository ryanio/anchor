name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  versions:
    name: node version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - run: node scripts/check-versions.ts

  service:
    name: service — typecheck & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # .node-version is the single source of truth — mise reads it locally too.
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: service/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  executor:
    name: executor — typecheck & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: executor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Native TypeScript execution, same reason as the service: no build step.
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: executor/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  site:
    name: site — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - run: node site/build.ts
