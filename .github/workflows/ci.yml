name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One job, named steps. Five separate jobs each paid ~12s of runner boot and checkout for ~10s of
# actual work, and the setup was duplicated five ways. Steps still attribute failures clearly in the
# UI, and the whole thing finishes faster than the old jobs took to start.
jobs:
  ci:
    name: lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The Cardputer app builds against flint, which is a submodule. Without this the firmware
          # step fails on a missing directory rather than on anything it is meant to catch.
          submodules: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # .node-version is the single source of truth — mise reads it locally too.
          node-version-file: '.node-version'
          cache: npm

      - name: Install
        run: |
          npm ci
          npm ci --prefix service
          npm ci --prefix executor
          npm ci --prefix devices

      - name: Versions are consistent
        run: node scripts/check-versions.ts

      - name: Contrast meets WCAG AA
        run: node scripts/check-contrast.ts

      - name: Lint and format
        run: npm run lint

      # `scripts/` is not a workspace and has no package.json, so nothing else here would run its
      # tests. It got them because a scoped capture used to delete the shots it was not asked to
      # retake, which cost a real review twenty-four panels — a bug with no runner is a bug that
      # comes back.
      - name: Scripts — test
        run: node --test scripts/

      - name: Service — typecheck and test
        run: |
          npx --prefix service tsc --noEmit --project service
          npm test --prefix service

      - name: Executor — typecheck and test
        run: |
          npx --prefix executor tsc --noEmit --project executor
          npm test --prefix executor

      # System dependencies, not npm ones: devices paint key faces by rasterising SVG. Two packages,
      # not one — ImageMagick 6 does not rasterise SVG itself, it shells out to `rsvg-convert`, so
      # imagemagick alone passes a version check and fails every render. CI found that the first
      # time it ran these tests, which is what the previous commit was for.
      # System dependencies, not npm ones: devices paint key faces by rasterising SVG.
      #
      # Three packages, and the third is the one that bites. ImageMagick 6 does not rasterise SVG
      # itself — it shells out to `rsvg-convert` — and on Ubuntu that delegate lives in
      # libmagickcore-6.q16-6-extra, a *recommend* of imagemagick rather than a depend.
      #
      # The step then proves it works, and fails if it does not. Without that the suites skip
      # themselves and `node --test` reports a whole skipped describe as no tests at all: the run
      # goes green having quietly not run thirty of them, which is the failure this workspace was
      # added to CI to stop.
      - name: Devices — install a rasteriser, and prove it rasterises
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick librsvg2-bin libmagickcore-6.q16-6-extra
          svg='<svg xmlns="http://www.w3.org/2000/svg" width="1" height="1"><rect width="1" height="1" fill="#ff0000"/></svg>'
          for bin in magick convert; do
            command -v "$bin" >/dev/null || continue
            bytes=$(printf '%s' "$svg" | "$bin" -background none svg:- -alpha remove -alpha off -depth 8 RGB:- | wc -c)
            echo "$bin rendered $bytes bytes (want 3)"
            [ "$bytes" = "3" ] && exit 0
          done
          echo "::error::no working SVG rasteriser after install — the devices paint tests would skip silently"
          exit 1

      - name: Devices — typecheck and test
        run: |
          npx --prefix devices tsc --noEmit --project devices
          npm test --prefix devices

      # No install step: the widget has no dependencies at all. Its logic lives in a plain script
      # that QML's engine loads, and the tests drive it through `require` under node --test.
      - name: Widget — test
        run: npm test --prefix widget

      # The Cardputer app lives here and builds against flint, so nothing else in this repo would
      # notice it breaking. The simulator target is the cheap one: `platform = native`, so it needs
      # SDL and a host compiler rather than the ESP32 toolchain, and it exercises the app pack
      # wiring — the build flags that select one app out of flint's ten — which is the part most
      # likely to rot when either side moves.
      - name: Cardputer app builds against flint
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libsdl2-dev
          pipx install platformio || pip install --user platformio
          pio run -e sim-anchor -d devices/firmware/cardputer

      - name: Site builds
        run: node site/build.ts
