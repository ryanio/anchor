name: Deploy site

on:
  push:
    branches: [main]
    paths: ['site/**', 'CHANGELOG.md', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  # Never cancel a publish in flight — a half-cancelled deploy is worse than a queued one.
  cancel-in-progress: false

jobs:
  deploy:
    name: build & publish to anchor.ryanio.com
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'

      - name: Build the site
        run: node site/build.ts

      # Cloudflare's dashboard now defaults to creating *Workers* projects, but `pages deploy`
      # needs a *Pages* project — an easy, invisible mismatch that failed this deploy with
      # "Project not found [code: 8000007]". Creating it here removes the manual prerequisite.
      # Expected to fail once the project exists, hence continue-on-error.
      - name: Ensure the Pages project exists
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create anchor --production-branch=main

      - name: Publish to Cloudflare Pages
        # Pinned to a commit, not a mutable tag: this action receives the deploy token, and
        # AGENTS.md treats every dependency as a supply-chain risk. Update deliberately.
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name=anchor --branch=main
