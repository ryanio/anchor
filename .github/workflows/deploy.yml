name: Deploy site

on:
  push:
    branches: [main]
    paths: ['site/**', 'CHANGELOG.md', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  # Never cancel a publish in flight — a half-cancelled deploy is worse than a queued one.
  cancel-in-progress: false

jobs:
  deploy:
    name: build & publish to anchor.ryanio.com
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Build the site
        run: node site/build.ts

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name=anchor --branch=main
