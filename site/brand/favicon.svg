<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Anchor">
  <style>
    /* Deep water on dark; the accent inverted on light. Matches theme/tokens.css. */
    .bg { fill: #06131a; }
    .fg { stroke: #5fd4e4; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #0d6b80; }
      .fg { stroke: #f7fafb; }
    }
  </style>
  <rect class="bg" width="64" height="64" rx="14"/>
  <!--
    The bar mark's geometry (anchor-bar.svg), scaled to the tile. A favicon is a 16px glyph, which
    is the case that drawing exists for: the full anchor's flukes have no pixels to live in at that
    size, and its stroke lands under one device pixel. Four elements instead of six is what buys
    the weight.
  -->
  <g class="fg" fill="none" stroke-width="6.7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="32" cy="19" r="7.2"/>
    <path d="M32 26.2L12 51.5"/>
    <path d="M32 26.2l20 25.3"/>
    <path d="M20.4 44.4h23.2"/>
  </g>
</svg>
