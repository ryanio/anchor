; Anchor Pulse firmware.
;
; The board on the desk, measured with esptool rather than read off a label:
;
;   Chip type   ESP32-S3 (QFN56) revision v0.2
;   Features    Wi-Fi, BT 5 (LE), dual core + LP core, 240MHz, embedded PSRAM 8MB (AP_3v3)
;   Flash       16MB, quad, 3.3V (manufacturer 20, device 4018)
;   USB mode    USB-Serial/JTAG
;   MAC         28:84:85:3a:d3:f0
;
; That is the N16R8 configuration. It is deliberately *not* the Cardputer, which is an ESP32-S3FN8
; with 8MB of flash and no PSRAM and has its own adapter and design doc.
;
; PlatformIO rather than arduino-cli because ~/Projects/cardputer already builds this way, so the
; workflow is one Ryan has. The layout stays an Arduino library (library.properties, src/) so the
; same core can be dropped into the IDE; `src_dir` is widened rather than the sources moved.

[platformio]
src_dir = .

[env:esp32s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0

; 16MB of flash and 8MB of octal PSRAM. `qio_opi` is the pairing for an N16R8: quad flash, octal
; RAM. Getting this wrong does not fail to build — it boots and finds no PSRAM, which is the
; failure that looks like a code bug for an hour.
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv

; The application and the portable protocol core, which is also compiled for the host by
; `devices/src/adapters/esp32-firmware.test.ts`. One copy, two targets.
build_src_filter = +<app/> +<src/>

build_flags =
	-I src
	-DBOARD_HAS_PSRAM
	; The board's only USB socket is wired to the S3's native USB. Without CDC_ON_BOOT the core
	; points `Serial` at UART0, where nothing on this unit is listening, and the firmware appears
	; to do nothing at all. `USB_MODE=1` selects the hardware USB-Serial/JTAG peripheral, which is
	; what esptool reports this chip is using.
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	; Nothing but the protocol may reach the wire once a host is attached, and the core's own logs
	; go to the same CDC endpoint. The boot banner this firmware prints is deliberate and the host
	; resynchronises past it; an ESP-IDF log line arriving mid-frame would not be.
	-DCORE_DEBUG_LEVEL=0
