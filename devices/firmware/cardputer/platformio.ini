; The Anchor panel for the M5Stack Cardputer ADV.
;
; The app is this repository's: app/src holds the view, the host link and the
; generated art, and app/sim holds the simulator's half of that link. The
; platform is flint (ryanio/cardputer), a git submodule in flint/, which brings
; the menu, the exit convention, the status bar, the keyboard layer and the
; simulator. Nothing here edits flint. An Anchor build compiles none of
; flint's own views except the two named in [anchor] below, offsite demo
; extras that share the menu carousel with Anchor rather than being lost
; behind it.
;
;   git submodule update --init          first, or nothing below works
;   pio run -e cardputer-adv-anchor -t upload
;   pio run -e sim-anchor -t exec
;
; See README.md, and flint/flint.ini for the two rules this file follows.
[platformio]
default_envs = sim-anchor
extra_configs = flint/flint.ini
; The project root. Every source pattern below is then a path down from here,
; which is what keeps each environment's objects under that environment.
src_dir = .

; Where the submodule is checked out, relative to src_dir.
[flint]
dir = flint

; The submodule guard.
;
; flint/flint.ini defines both sections below, and extra_configs are read after
; the file that included them, so with the submodule checked out every option
; here is replaced. With it missing these stand, and `extra_scripts` stands
; either way, because flint.ini does not set it. So the script runs on every
; build and says the word submodule, rather than leaving PlatformIO to report
; `No section: 'flint_adv'` and a contributor to guess what that means.
[flint_adv]
platform = native
build_src_filter = -<*>
build_flags =
extra_scripts = pre:tools/require-flint.py

[flint_sim]
platform = native
build_src_filter = -<*>
build_flags =
extra_scripts = pre:tools/require-flint.py

; Common to both builds: flint's own nine remaining apps are not in an Anchor
; build at all. Not hidden by a profile, not unreachable from a menu: not
; compiled. Maze and Calm are the exception, added for the OpenSea offsite: a
; unit handed to someone who has never seen Anchor should have something to
; play with in the first ten seconds, not just a portfolio they do not own.
; Beat was tried too and dropped: the ADV's speaker is not good enough to
; carry an eight step drum machine, so a keyboard-only view stayed out rather
; than shipping a worse version of it. Both were picked because they need
; nothing this profile does not already have: no network, no store prefix of
; their own, no glyph atlas — just ui/view and, for Maze, motion. They cost
; nothing when nobody opens them: profile::enabled() is a name check against
; FLINT_PROFILE_VIEWS, run once per view before setup.
;
; FLINT_PROFILE_NETWORK=1, against flint's own default advice for an app pack
; and against this repository's own original design (docs/devices-cardputer.md
; argued for cable-only, on purpose). A unit taken away from the desk needs
; something to show, and Ryan chose live WiFi discovery over either standing
; on the last cable-fed frame or a static standby screen, with a key on the
; device — overriding flint's own AGENTS.md ("No secrets on the device... if
; something seems to need a key, the design is wrong," naming Anchor as the
; reason for the rule) as an explicit, informed choice for this deployment,
; not an oversight. See app/src/standalone.cpp for what the radio is for and
; app/include/secrets.h.example for what it needs.
; Setup is flint's own WiFi view (src/views/setup.cpp): scan, pick, type a passphrase on the
; keyboard, save to NVS. It needs nothing this profile does not already have (FLINT_PROFILE_NETWORK
; is already 1 for standalone.cpp above), and it is the on-device answer to secrets.h being a
; dev-unit fallback only per flint/AGENTS.md — a unit handed out at the offsite gets WiFi typed on
; it by whoever is holding it, not baked in before it left this desk.
[anchor]
build_src_filter =
	-<${flint.dir}/src/views/>
	+<${flint.dir}/src/views/maze.cpp>
	+<${flint.dir}/src/views/calm.cpp>
	+<${flint.dir}/src/views/setup.cpp>
	+<app/src/*>
build_flags =
	-Iapp/src
	-DFLINT_PROFILE='"anchor"'
	-DFLINT_PROFILE_VIEWS='"Anchor,Maze,Calm,Setup"'
	-DFLINT_PROFILE_NETWORK=1

; The unit.
[env:cardputer-adv-anchor]
extends = flint_adv
build_src_filter = ${flint_adv.build_src_filter} ${anchor.build_src_filter}
build_flags = ${flint_adv.build_flags} ${anchor.build_flags}

; The same panel on the desktop, with the host link answering from a capture
; taken off the real adapter. No hardware, and no host attached.
;
;   pio run -e sim-anchor -t exec
;   .pio/build/sim-anchor/program --keys "azuki" --shot /tmp/anchor --quit-after 6000
[env:sim-anchor]
extends = flint_sim
build_src_filter =
	${flint_sim.build_src_filter}
	${anchor.build_src_filter}
	; The unit's half of the cable is a USB CDC port. Here it is a replayed
	; capture, so the two never build together.
	-<app/src/cable.cpp>
	; standalone.cpp calls the real HTTPClient/WiFiClientSecure, which do not exist for `platform =
	; native`. app/sim/standalone_sim.cpp stands in, the same swap cable.cpp gets above.
	-<app/src/standalone.cpp>
	+<app/sim/*>
build_flags = ${flint_sim.build_flags} ${anchor.build_flags}
