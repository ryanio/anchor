; The Anchor panel for the M5Stack Cardputer ADV.
;
; The app is this repository's: app/src holds the view, the host link and the
; generated art, and app/sim holds the simulator's half of that link. The
; platform is flint (ryanio/cardputer), a git submodule in flint/, which brings
; the menu, the exit convention, the status bar, the keyboard layer and the
; simulator. Nothing here edits flint, and an Anchor build compiles none of
; flint's own views.
;
;   git submodule update --init          first, or nothing below works
;   pio run -e cardputer-adv-anchor -t upload
;   pio run -e sim-anchor -t exec
;
; See README.md, and flint/flint.ini for the two rules this file follows.
[platformio]
default_envs = sim-anchor
extra_configs = flint/flint.ini
; The project root. Every source pattern below is then a path down from here,
; which is what keeps each environment's objects under that environment.
src_dir = .

; Where the submodule is checked out, relative to src_dir.
[flint]
dir = flint

; The submodule guard.
;
; flint/flint.ini defines both sections below, and extra_configs are read after
; the file that included them, so with the submodule checked out every option
; here is replaced. With it missing these stand, and `extra_scripts` stands
; either way, because flint.ini does not set it. So the script runs on every
; build and says the word submodule, rather than leaving PlatformIO to report
; `No section: 'flint_adv'` and a contributor to guess what that means.
[flint_adv]
platform = native
build_src_filter = -<*>
build_flags =
extra_scripts = pre:tools/require-flint.py

[flint_sim]
platform = native
build_src_filter = -<*>
build_flags =
extra_scripts = pre:tools/require-flint.py

; Common to both builds: flint's own eleven apps are not in an Anchor build at
; all. Not hidden by a profile, not unreachable from a menu: not compiled. The
; profile is declared in flags because an app pack cannot add a row to flint's
; table, and it says no radio, because Anchor's data comes down the cable from
; a desktop and a radio nothing uses is attack surface with no upside.
[anchor]
build_src_filter =
	-<${flint.dir}/src/views/>
	+<app/src/*>
build_flags =
	-Iapp/src
	-DFLINT_PROFILE='"anchor"'
	-DFLINT_PROFILE_VIEWS='"Anchor"'
	-DFLINT_PROFILE_NETWORK=0

; The unit.
[env:cardputer-adv-anchor]
extends = flint_adv
build_src_filter = ${flint_adv.build_src_filter} ${anchor.build_src_filter}
build_flags = ${flint_adv.build_flags} ${anchor.build_flags}

; The same panel on the desktop, with the host link answering from a capture
; taken off the real adapter. No hardware, and no host attached.
;
;   pio run -e sim-anchor -t exec
;   .pio/build/sim-anchor/program --keys "azuki" --shot /tmp/anchor --quit-after 6000
[env:sim-anchor]
extends = flint_sim
build_src_filter =
	${flint_sim.build_src_filter}
	${anchor.build_src_filter}
	; The unit's half of the cable is a USB CDC port. Here it is a replayed
	; capture, so the two never build together.
	-<app/src/cable.cpp>
	+<app/sim/*>
build_flags = ${flint_sim.build_flags} ${anchor.build_flags}
